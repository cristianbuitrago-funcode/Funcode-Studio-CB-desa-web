[project]
name = "fwa-backend"
version = "0.1.0"
description = "Backend local de Funcode Web Architect"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163,<0.164",
    "uvicorn>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
]

[project.scripts]
fwa-backend = "fwa.main:run"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "httpx2>=2.16,<3",
    "ruff>=0.17",
    "mypy>=2.4",
    "pyinstaller>=6.22,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fwa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
