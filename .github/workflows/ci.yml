name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  PNPM_VERSION: "10.28.0"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -v

  frontend:
    name: Interfaz (pruebas y extremo a extremo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: El contrato de la API está sincronizado
        working-directory: desktop
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm typecheck
        working-directory: desktop
      - run: pnpm test
        working-directory: desktop
      - run: pnpm build
        working-directory: desktop
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: desktop
      - run: pnpm test:e2e --trace off
        working-directory: desktop

  desktop-windows:
    name: Escritorio en Windows (compilación y prueba de humo)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Empaquetar el backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run python packaging/build_sidecar.py

      - name: Prueba de humo del backend empaquetado
        working-directory: backend
        shell: pwsh
        run: |
          $exe = Get-ChildItem ..\desktop\src-tauri\binaries\fwa-backend-*.exe | Select-Object -First 1
          uv run python packaging/smoke_test.py $exe.FullName

      - name: Pruebas del núcleo Rust
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ..\dist | Out-Null
          Set-Content ..\dist\index.html "<!doctype html><title>x</title>"
          cargo test

      - name: Compilar la aplicación y el instalador
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles nsis --config src-tauri/tauri.bundle.conf.json

      - name: Prueba de humo de la ventana
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop\src-tauri\target\release\*.exe | Where-Object { $_.Name -ne "fwa-backend.exe" } | Select-Object -First 1
          Write-Host "Ejecutable: $($exe.FullName)"
          pwsh desktop\scripts\windows-window-smoke.ps1 -AppPath $exe.FullName -Screenshot ventana-windows.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funcode-web-architect-windows
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            ventana-windows.png
